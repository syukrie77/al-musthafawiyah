# almusthafawiyah.sch.id — Pondok Pesantren Al-Musthafawiyah — Phase 1: HTTP only
# Setelah SSL ready (certbot), config ini akan di-update ke HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name almusthafawiyah.sch.id www.almusthafawiyah.sch.id;

    # ACME challenge untuk certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # === Webroot ===
    root /var/www/almusthafawiyah.sch.id;
    index index.html;
    charset utf-8;

    # === Gzip ===
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml image/svg+xml
        application/vnd.ms-fontobject font/woff font/woff2;

    # === Cache assets ===
    location ~* \.(jpg|jpeg|png|gif|ico|webp|avif|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location ~* \.(css|js|mjs)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /sitemap-index.xml { default_type application/xml; expires 1d; }
    location = /sitemap-0.xml     { default_type application/xml; expires 1d; }
    location = /rss.xml           { default_type application/rss+xml; expires 1d; }
    location = /robots.txt        { default_type text/plain; expires 7d; }
    location = /llms.txt          { default_type text/plain; expires 7d; }

    location /admin/ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/index.html $uri.html /404.html;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~ /\. { deny all; access_log off; log_not_found off; }

    access_log /var/log/nginx/almusthafawiyah.sch.id-access.log;
    error_log  /var/log/nginx/almusthafawiyah.sch.id-error.log;
}
