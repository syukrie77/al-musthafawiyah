# aibs.sch.id — AIBS (Sekolah AI)
# Static site hasil build Astro (dist/) yang di-deploy ke /var/www/aibs.sch.id
# Update otomatis via scripts/deploy.sh (setelah generate blog)

server {
    listen 80;
    listen [::]:80;
    server_name aibs.sch.id www.aibs.sch.id;

    # ACME challenge untuk certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect www → non-www (canonical)
    if ($host = www.aibs.sch.id) {
        return 301 https://aibs.sch.id$request_uri;
    }

    # HTTPS redirect (diaktifkan setelah SSL ready)
    return 301 https://aibs.sch.id$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aibs.sch.id;

    # === SSL (certbot akan mengisi path ini) ===
    ssl_certificate     /etc/letsencrypt/live/aibs.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aibs.sch.id/privkey.pem;

    # === Security headers ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # === Webroot ===
    root /var/www/aibs.sch.id;
    index index.html;

    # Charset
    charset utf-8;

    # === Gzip ===
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        application/vnd.ms-fontobject
        font/woff
        font/woff2;

    # === Brotli jika tersedia ===
    # (aktifkan kalau nginx sudah pakai modul brotli)

    # === Cache assets statis ===
    location ~* \.(jpg|jpeg|png|gif|ico|webp|avif|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(css|js|mjs)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # === Sitemap & RSS (server side include) ===
    location = /sitemap-index.xml {
        default_type application/xml;
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /sitemap-0.xml {
        default_type application/xml;
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /rss.xml {
        default_type application/rss+xml;
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /robots.txt {
        default_type text/plain;
        expires 7d;
        add_header Cache-Control "public";
    }

    # === Decap CMS admin ===
    location /admin/ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # === Trailing slash (sesuai Astro trailingSlash: 'always') ===
    # Kalau request tanpa slash ke file yang bukan aset → redirect ke versi slash
    location / {
        try_files $uri $uri/index.html $uri.html /404.html;
    }

    # === Custom 404 ===
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # === Deny akses file tersembunyi ===
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/aibs.sch.id-access.log;
    error_log  /var/log/nginx/aibs.sch.id-error.log;
}
